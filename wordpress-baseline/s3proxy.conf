
RewriteEngine on
ProxyPassInterpolateEnv On
ProxyRequests off

# Unset headers: you must unset X-Amz-Cf-Id, else InvalidSignature error will result. X-Amzn-Trace-Id seems innocuous, but is unnecessary.
RequestHeader unset X-Amz-Cf-Id
RequestHeader unset X-Amzn-Trace-Id

# Clear the mod_shib attribute headers at this trust boundary. Nothing in this image sets trusted
# values for them, but downstream consumers still read them, so forwarding viewer-supplied values
# would allow identity spoofing. On a mod_shib host, the module performs this clearing itself.
#
# Clear only the headers owned by mod_shib here. Edge-owned identity headers (authenticated,
# user-details, and the eduPerson* claims) are sanitized and populated at the edge; unsetting them
# here would also remove trusted values.
RequestHeader unset Eppn
RequestHeader unset Affiliation
RequestHeader unset Unscoped-Affiliation
RequestHeader unset Primary-Affiliation
RequestHeader unset Entitlement

# Clear X-Forwarded-Host before proxying. mod_proxy appends instead of replacing it, so a
# viewer-supplied value would remain first. The Object Lambda treats that first value as authoritative
# when selecting the S3 key prefix and DynamoDB rule key, allowing cross-site routing and rule lookup.
#
# This does not remove required origin context: mod_proxy regenerates X-Forwarded-Host from Host.
RequestHeader unset X-Forwarded-Host

<Location ~ ^/+([^/]+/){0,2}files/(.*)$>
  ProxyPass "S3PROXY_HOST_PLACEHOLDER"
  ProxyPassReverse [L]
</Location>

# Define custom error pages for proxy errors
ProxyErrorOverride On

ErrorDocument 401 /_s3proxy-custom-errors/401-unauthorized.php
ErrorDocument 403 /_s3proxy-custom-errors/403-forbidden.php
ErrorDocument 404 /_s3proxy-custom-errors/404-not-found.php
